<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1020"/>
      <stop offset="50%" stop-color="#121D38"/>
      <stop offset="100%" stop-color="#19284F"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="coralGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7D66"/>
      <stop offset="100%" stop-color="#F06449"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 48, 86, 0.75)"/>
      <stop offset="100%" stop-color="rgba(16, 28, 54, 0.85)"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad4)"/>

  <!-- Glowing Orbs -->
  <circle cx="160" cy="120" r="130" fill="#38BDF8" opacity="0.12" filter="url(#glow4)"/>
  <circle cx="480" cy="240" r="140" fill="#F06449" opacity="0.12" filter="url(#glow4)"/>

  <!-- Background Grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>

  <!-- Left: Developer Code Terminal Card -->
  <g transform="translate(60, 50)">
    <rect width="260" height="260" rx="16" fill="url(#cardGrad4)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>
    <!-- Terminal Header -->
    <path d="M0 16 Q0 0 16 0 L244 0 Q260 0 260 16 L260 38 L0 38 Z" fill="rgba(10, 18, 36, 0.85)"/>
    <circle cx="18" cy="19" r="4.5" fill="#EF4444"/>
    <circle cx="32" cy="19" r="4.5" fill="#F59E0B"/>
    <circle cx="46" cy="19" r="4.5" fill="#10B981"/>
    <text x="75" y="23" fill="#94A3B8" font-family="monospace" font-size="10">developer-audit.ts</text>

    <!-- Syntax Code Lines -->
    <g transform="translate(18, 55)" font-family="monospace" font-size="11">
      <!-- Line 1 -->
      <text x="0" y="15" fill="#F06449">interface</text>
      <text x="70" y="15" fill="#38BDF8">AgencyCriteria</text>
      <text x="175" y="15" fill="#FFFFFF">{</text>
      <!-- Line 2 -->
      <text x="14" y="35" fill="#94A3B8">cleanCode:</text>
      <text x="95" y="35" fill="#10B981">true,</text>
      <!-- Line 3 -->
      <text x="14" y="55" fill="#94A3B8">mobileFirst:</text>
      <text x="105" y="55" fill="#10B981">true,</text>
      <!-- Line 4 -->
      <text x="14" y="75" fill="#94A3B8">directWhatsApp:</text>
      <text x="130" y="75" fill="#10B981">true,</text>
      <!-- Line 5 -->
      <text x="14" y="95" fill="#94A3B8">localSupport:</text>
      <text x="115" y="95" fill="#F59E0B">'Karachi',</text>
      <!-- Line 6 -->
      <text x="14" y="115" fill="#94A3B8">loadingSpeed:</text>
      <text x="115" y="115" fill="#38BDF8">'&lt; 1.5s'</text>
      <!-- Line 7 -->
      <text x="0" y="135" fill="#FFFFFF">}</text>
    </g>

    <!-- Terminal Status Tag -->
    <rect x="18" y="215" width="224" height="28" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)"/>
    <circle cx="34" cy="229" r="5" fill="#10B981"/>
    <text x="48" y="233" fill="#10B981" font-family="system-ui, sans-serif" font-size="10" font-weight="700">100% QUALITY BENCHMARK PASSED</text>
  </g>

  <!-- Right: Verification & Reliability Badge Stack -->
  <g transform="translate(360, 50)">
    <!-- Security & Trust Card -->
    <rect width="220" height="120" rx="16" fill="url(#cardGrad4)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="24" fill="url(#shieldGrad)" filter="url(#glow4)"/>
    <!-- Checkmark in shield -->
    <path d="M 42 50 L 48 56 L 58 44" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="90" y="35" width="105" height="10" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <rect x="90" y="52" width="85" height="7" rx="2" fill="#10B981"/>
    <rect x="25" y="88" width="170" height="18" rx="6" fill="rgba(255, 255, 255, 0.05)"/>
    <text x="110" y="100" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Transparent Pricing &#8226; No Surprises</text>

    <!-- Performance Speed Card -->
    <g transform="translate(0, 140)">
      <rect width="220" height="120" rx="16" fill="url(#cardGrad4)" stroke="rgba(240, 100, 73, 0.3)" stroke-width="1.5"/>
      <circle cx="50" cy="50" r="24" fill="url(#coralGrad4)" filter="url(#glow4)"/>
      <!-- Rocket icon -->
      <path d="M 53 38 C 55 42 55 48 50 53 C 45 58 39 58 35 60 C 37 56 37 50 42 45 C 47 40 50 38 53 38 Z" fill="#FFFFFF"/>
      <circle cx="47" cy="46" r="2" fill="#F06449"/>
      <rect x="90" y="35" width="105" height="10" rx="3" fill="#FFFFFF" opacity="0.9"/>
      <rect x="90" y="52" width="75" height="7" rx="2" fill="#F06449"/>
      <rect x="25" y="88" width="170" height="18" rx="6" fill="rgba(255, 255, 255, 0.05)"/>
      <text x="110" y="100" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Ultra-Fast Responsive Builds</text>
    </g>
  </g>

  <!-- Top Floating Badge -->
  <g transform="translate(245, 18)">
    <rect width="150" height="36" rx="18" fill="#111C38" stroke="#38BDF8" stroke-width="1.5" filter="url(#glow4)"/>
    <circle cx="20" cy="18" r="8" fill="#38BDF8"/>
    <!-- Code bracket icon -->
    <path d="M 17 14 L 14 18 L 17 22 M 23 14 L 26 18 L 23 22" fill="none" stroke="#0F172A" stroke-width="1.6" stroke-linecap="round"/>
    <text x="36" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">CODE QUALITY</text>
  </g>
</svg>