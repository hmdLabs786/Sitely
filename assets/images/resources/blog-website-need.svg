<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1020"/>
      <stop offset="50%" stop-color="#111C35"/>
      <stop offset="100%" stop-color="#1A284D"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7D66"/>
      <stop offset="100%" stop-color="#F06449"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 48, 86, 0.75)"/>
      <stop offset="100%" stop-color="rgba(16, 28, 54, 0.85)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="520" cy="90" r="120" fill="#F06449" opacity="0.12" filter="url(#glow)"/>
  <circle cx="120" cy="270" r="140" fill="#38BDF8" opacity="0.10" filter="url(#glow)"/>

  <!-- Background Grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>

  <!-- Main Browser Window Mockup -->
  <g transform="translate(60, 45)">
    <!-- Browser Frame -->
    <rect width="400" height="260" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
    <!-- Window Header -->
    <path d="M0 14 Q0 0 14 0 L386 0 Q400 0 400 14 L400 38 L0 38 Z" fill="rgba(10, 18, 36, 0.75)"/>
    <!-- Window Dots -->
    <circle cx="22" cy="19" r="4.5" fill="#EF4444"/>
    <circle cx="36" cy="19" r="4.5" fill="#F59E0B"/>
    <circle cx="50" cy="19" r="4.5" fill="#10B981"/>
    <!-- URL Bar -->
    <rect x="74" y="10" width="220" height="18" rx="9" fill="rgba(255, 255, 255, 0.08)"/>
    <circle cx="86" cy="19" r="3" fill="#38BDF8"/>
    <rect x="96" y="16" width="110" height="6" rx="3" fill="rgba(255, 255, 255, 0.45)"/>
    <rect x="214" y="16" width="30" height="6" rx="3" fill="rgba(56, 189, 248, 0.6)"/>

    <!-- Browser Body Visuals -->
    <!-- Hero Banner Mockup inside browser -->
    <rect x="20" y="54" width="360" height="85" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.06)"/>
    <rect x="36" y="70" width="160" height="14" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <rect x="36" y="92" width="220" height="8" rx="3" fill="rgba(255, 255, 255, 0.45)"/>
    <rect x="36" y="106" width="140" height="8" rx="3" fill="rgba(255, 255, 255, 0.3)"/>
    <rect x="290" y="68" width="74" height="56" rx="6" fill="url(#coralGrad)" opacity="0.85"/>
    <circle cx="327" cy="96" r="14" fill="#FFFFFF" opacity="0.9"/>

    <!-- 3 Catalog Grid Cards -->
    <rect x="20" y="152" width="110" height="90" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
    <rect x="30" y="162" width="90" height="42" rx="5" fill="rgba(56, 189, 248, 0.2)"/>
    <rect x="30" y="212" width="70" height="8" rx="3" fill="#FFFFFF" opacity="0.75"/>
    <rect x="30" y="226" width="40" height="6" rx="2" fill="url(#coralGrad)"/>

    <rect x="145" y="152" width="110" height="90" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
    <rect x="155" y="162" width="90" height="42" rx="5" fill="rgba(240, 100, 73, 0.2)"/>
    <rect x="155" y="212" width="70" height="8" rx="3" fill="#FFFFFF" opacity="0.75"/>
    <rect x="155" y="226" width="40" height="6" rx="2" fill="url(#cyanGrad)"/>

    <rect x="270" y="152" width="110" height="90" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
    <rect x="280" y="162" width="90" height="42" rx="5" fill="rgba(16, 185, 129, 0.2)"/>
    <rect x="280" y="212" width="70" height="8" rx="3" fill="#FFFFFF" opacity="0.75"/>
    <rect x="280" y="226" width="40" height="6" rx="2" fill="rgba(16, 185, 129, 0.8)"/>
  </g>

  <!-- Floating Smartphone Mockup -->
  <g transform="translate(430, 80)">
    <!-- Phone Body -->
    <rect width="145" height="235" rx="22" fill="#0E1628" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
    <!-- Phone Notch / Island -->
    <rect x="48" y="8" width="50" height="8" rx="4" fill="rgba(255, 255, 255, 0.15)"/>
    <!-- Phone Screen Content -->
    <rect x="10" y="26" width="125" height="195" rx="14" fill="#14213D"/>
    <!-- Mobile Header -->
    <circle cx="26" cy="42" r="7" fill="url(#coralGrad)"/>
    <rect x="40" y="38" width="50" height="8" rx="3" fill="#FFFFFF" opacity="0.8"/>
    <!-- Mobile Product Card -->
    <rect x="18" y="58" width="109" height="75" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)"/>
    <rect x="26" y="66" width="93" height="40" rx="6" fill="url(#cyanGrad)" opacity="0.7"/>
    <rect x="26" y="112" width="60" height="6" rx="2" fill="#FFFFFF" opacity="0.8"/>
    <rect x="26" y="122" width="35" height="5" rx="2" fill="#10B981"/>
    <!-- WhatsApp Order Button -->
    <rect x="18" y="142" width="109" height="32" rx="16" fill="#25D366"/>
    <circle cx="34" cy="158" r="6" fill="#FFFFFF"/>
    <rect x="46" y="155" width="56" height="6" rx="2" fill="#FFFFFF"/>
    <!-- Active Indicator -->
    <circle cx="106" cy="158" r="3" fill="#FFFFFF"/>
  </g>

  <!-- 24/7 Storefront Floating Badge -->
  <g transform="translate(320, 20)">
    <rect width="165" height="42" rx="21" fill="url(#coralGrad)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="24" cy="21" r="10" fill="#FFFFFF"/>
    <!-- Pulse check / clock icon -->
    <path d="M21 21 L24 24 L29 18" stroke="#F06449" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="25" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">24/7 STOREFRONT</text>
  </g>

  <!-- SEO / Growth Floating Badge -->
  <g transform="translate(30, 275)">
    <rect width="145" height="38" rx="19" fill="#101A30" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="8" fill="rgba(56, 189, 248, 0.2)"/>
    <path d="M16 22 L20 16 L24 22" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="36" y="23" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Google SEO Rank</text>
  </g>
</svg>