<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1020"/>
      <stop offset="50%" stop-color="#111B34"/>
      <stop offset="100%" stop-color="#18274A"/>
    </linearGradient>
    <linearGradient id="waGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="coralGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7D66"/>
      <stop offset="100%" stop-color="#F06449"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(28, 44, 80, 0.75)"/>
      <stop offset="100%" stop-color="rgba(14, 24, 48, 0.85)"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad3)"/>

  <!-- Glowing Orbs -->
  <circle cx="160" cy="180" r="130" fill="#25D366" opacity="0.10" filter="url(#glow3)"/>
  <circle cx="480" cy="140" r="140" fill="#818CF8" opacity="0.12" filter="url(#glow3)"/>

  <!-- Background Grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>

  <!-- Left: WhatsApp Automated Conversation Stream -->
  <g transform="translate(60, 50)">
    <rect width="210" height="260" rx="16" fill="url(#cardGrad3)" stroke="rgba(37, 211, 102, 0.3)" stroke-width="1.5"/>
    <!-- App Bar -->
    <path d="M0 16 Q0 0 16 0 L194 0 Q210 0 210 16 L210 44 L0 44 Z" fill="url(#waGrad)"/>
    <circle cx="24" cy="22" r="12" fill="#FFFFFF"/>
    <!-- Bot Avatar -->
    <circle cx="24" cy="22" r="7" fill="#128C7E"/>
    <rect x="44" y="15" width="90" height="7" rx="3" fill="#FFFFFF"/>
    <rect x="44" y="26" width="60" height="5" rx="2" fill="rgba(255, 255, 255, 0.7)"/>

    <!-- Incoming Customer Message Bubble -->
    <rect x="14" y="58" width="135" height="42" rx="10" fill="rgba(255, 255, 255, 0.1)"/>
    <rect x="24" y="68" width="100" height="6" rx="2" fill="#FFFFFF" opacity="0.8"/>
    <rect x="24" y="78" width="70" height="6" rx="2" fill="rgba(255, 255, 255, 0.5)"/>

    <!-- Automated AI Instant Reply Bubble -->
    <rect x="60" y="112" width="136" height="54" rx="10" fill="url(#waGrad)" opacity="0.9"/>
    <rect x="70" y="122" width="112" height="6" rx="2" fill="#FFFFFF"/>
    <rect x="70" y="132" width="90" height="6" rx="2" fill="#FFFFFF" opacity="0.85"/>
    <rect x="70" y="143" width="55" height="5" rx="2" fill="#FFFFFF" opacity="0.7"/>

    <!-- Order Confirmed Card -->
    <rect x="14" y="178" width="182" height="68" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <circle cx="34" cy="200" r="10" fill="#10B981"/>
    <path d="M 30 200 L 33 203 L 38 197" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <rect x="52" y="192" width="95" height="7" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="52" y="204" width="70" height="5" rx="2" fill="#10B981"/>
    <rect x="24" y="222" width="162" height="14" rx="7" fill="rgba(37, 211, 102, 0.2)"/>
    <text x="105" y="233" fill="#25D366" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">SYNCED TO GOOGLE SHEETS</text>
  </g>

  <!-- Central Dynamic Automation Flow -->
  <g transform="translate(285, 140)">
    <!-- Circuit lines -->
    <path d="M 0 40 L 70 40" fill="none" stroke="#818CF8" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="35" cy="40" r="24" fill="#0E172A" stroke="#818CF8" stroke-width="2" filter="url(#glow3)"/>
    <!-- Lightning bolt -->
    <path d="M 35 28 L 29 41 L 34 41 L 32 52 L 41 39 L 36 39 Z" fill="#F59E0B"/>
  </g>

  <!-- Right: Dashboard Sync & Analytics Engine -->
  <g transform="translate(370, 50)">
    <rect width="210" height="260" rx="16" fill="url(#cardGrad3)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1.5"/>
    <!-- Dashboard Top Bar -->
    <path d="M0 16 Q0 0 16 0 L194 0 Q210 0 210 16 L210 38 L0 38 Z" fill="rgba(12, 20, 40, 0.8)"/>
    <circle cx="16" cy="19" r="4" fill="#EF4444"/>
    <circle cx="28" cy="19" r="4" fill="#F59E0B"/>
    <circle cx="40" cy="19" r="4" fill="#10B981"/>
    <rect x="56" y="14" width="80" height="10" rx="4" fill="rgba(255, 255, 255, 0.1)"/>

    <!-- CRM Sync Node Header -->
    <rect x="16" y="50" width="178" height="42" rx="8" fill="rgba(129, 140, 248, 0.12)" stroke="rgba(129, 140, 248, 0.25)"/>
    <circle cx="34" cy="71" r="10" fill="url(#aiGrad)"/>
    <rect x="52" y="64" width="70" height="6" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="52" y="74" width="95" height="5" rx="2" fill="#818CF8"/>

    <!-- Automated Row Items (Google Sheets Mock) -->
    <rect x="16" y="102" width="178" height="32" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.06)"/>
    <circle cx="30" cy="118" r="5" fill="#10B981"/>
    <rect x="44" y="113" width="75" height="5" rx="2" fill="#FFFFFF" opacity="0.8"/>
    <rect x="44" y="121" width="45" height="4" rx="2" fill="rgba(255, 255, 255, 0.4)"/>
    <rect x="135" y="112" width="50" height="12" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
    <rect x="142" y="116" width="36" height="4" rx="2" fill="#10B981"/>

    <rect x="16" y="142" width="178" height="32" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.06)"/>
    <circle cx="30" cy="158" r="5" fill="#38BDF8"/>
    <rect x="44" y="153" width="75" height="5" rx="2" fill="#FFFFFF" opacity="0.8"/>
    <rect x="44" y="161" width="45" height="4" rx="2" fill="rgba(255, 255, 255, 0.4)"/>
    <rect x="135" y="152" width="50" height="12" rx="4" fill="rgba(56, 189, 248, 0.2)"/>
    <rect x="142" y="156" width="36" height="4" rx="2" fill="#38BDF8"/>

    <!-- Hours Saved Stat Metric -->
    <rect x="16" y="186" width="178" height="58" rx="8" fill="url(#coralGrad3)" opacity="0.95"/>
    <text x="32" y="212" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="800">10+ Hrs</text>
    <text x="32" y="230" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600" opacity="0.9">Saved per week in manual tasks</text>
  </g>

  <!-- Top Floating Badge -->
  <g transform="translate(245, 18)">
    <rect width="150" height="36" rx="18" fill="#13203E" stroke="#25D366" stroke-width="1.5" filter="url(#glow3)"/>
    <circle cx="20" cy="18" r="8" fill="#25D366"/>
    <path d="M 17 18 L 19 20 L 23 16" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <text x="36" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">AI WORKFLOWS</text>
  </g>
</svg>