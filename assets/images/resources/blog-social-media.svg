<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1020"/>
      <stop offset="50%" stop-color="#121D38"/>
      <stop offset="100%" stop-color="#1A2950"/>
    </linearGradient>
    <linearGradient id="socialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1306C"/>
      <stop offset="50%" stop-color="#FD1D1D"/>
      <stop offset="100%" stop-color="#F77737"/>
    </linearGradient>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 48, 86, 0.75)"/>
      <stop offset="100%" stop-color="rgba(16, 28, 54, 0.85)"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad2)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="120" r="130" fill="#E1306C" opacity="0.12" filter="url(#glow2)"/>
  <circle cx="490" cy="200" r="140" fill="#38BDF8" opacity="0.12" filter="url(#glow2)"/>

  <!-- Background Grid Lines -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>

  <!-- Connecting Conversion Flow Pathway -->
  <path d="M 230 180 Q 320 120 400 180" fill="none" stroke="url(#webGrad)" stroke-width="3" stroke-dasharray="6,6" opacity="0.8"/>
  <circle cx="315" cy="145" r="18" fill="#101A33" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 310 145 L 320 145 M 316 140 L 321 145 L 316 150" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>

  <!-- Left: Social Media Channel Card -->
  <g transform="translate(60, 60)">
    <!-- Container Card -->
    <rect width="180" height="230" rx="16" fill="url(#cardGrad2)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    <!-- Social Banner Header -->
    <rect x="0" y="0" width="180" height="60" rx="16" fill="url(#socialGrad)" opacity="0.85"/>
    <rect x="0" y="45" width="180" height="15" fill="url(#socialGrad)" opacity="0.85"/>
    <!-- Profile Avatar -->
    <circle cx="45" cy="60" r="22" fill="#0F172A" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="45" cy="60" r="17" fill="url(#socialGrad)"/>
    <!-- Feed items -->
    <rect x="75" y="70" width="80" height="8" rx="3" fill="#FFFFFF" opacity="0.8"/>
    <rect x="75" y="84" width="50" height="6" rx="2" fill="rgba(255, 255, 255, 0.5)"/>

    <!-- Social Post Preview Cards -->
    <rect x="18" y="105" width="144" height="48" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)"/>
    <rect x="26" y="113" width="32" height="32" rx="6" fill="url(#socialGrad)" opacity="0.7"/>
    <rect x="66" y="117" width="82" height="6" rx="2" fill="#FFFFFF" opacity="0.75"/>
    <rect x="66" y="129" width="60" height="5" rx="2" fill="rgba(255, 255, 255, 0.4)"/>

    <!-- Social Metrics -->
    <rect x="18" y="165" width="144" height="45" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
    <circle cx="36" cy="187" r="10" fill="rgba(225, 48, 108, 0.25)"/>
    <path d="M 33 187 L 35 189 L 39 184" fill="none" stroke="#E1306C" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="54" y="180" width="60" height="6" rx="2" fill="#FFFFFF" opacity="0.8"/>
    <rect x="54" y="191" width="40" height="5" rx="2" fill="#10B981"/>
  </g>

  <!-- Right: Dedicated Brand Website Hub Card -->
  <g transform="translate(400, 50)">
    <!-- Main Card Body -->
    <rect width="190" height="250" rx="16" fill="url(#cardGrad2)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2"/>
    <!-- Browser Top Bar -->
    <path d="M0 16 Q0 0 16 0 L174 0 Q190 0 190 16 L190 36 L0 36 Z" fill="rgba(10, 18, 36, 0.85)"/>
    <circle cx="16" cy="18" r="4" fill="#EF4444"/>
    <circle cx="28" cy="18" r="4" fill="#F59E0B"/>
    <circle cx="40" cy="18" r="4" fill="#10B981"/>
    <rect x="55" y="11" width="120" height="15" rx="7.5" fill="rgba(255, 255, 255, 0.1)"/>
    <rect x="70" y="15" width="75" height="6" rx="2" fill="#38BDF8"/>

    <!-- Website Brand Header -->
    <rect x="18" y="48" width="154" height="42" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.25)"/>
    <circle cx="36" cy="69" r="11" fill="url(#webGrad)"/>
    <rect x="54" y="62" width="75" height="7" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="54" y="73" width="50" height="5" rx="2" fill="#10B981"/>
    <circle cx="152" cy="69" r="6" fill="#10B981"/>

    <!-- Permanent Product Catalogue Grid -->
    <rect x="18" y="100" width="72" height="70" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)"/>
    <rect x="25" y="107" width="58" height="34" rx="4" fill="rgba(56, 189, 248, 0.25)"/>
    <rect x="25" y="147" width="45" height="5" rx="2" fill="#FFFFFF" opacity="0.75"/>
    <rect x="25" y="156" width="30" height="5" rx="2" fill="#F06449"/>

    <rect x="100" y="100" width="72" height="70" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)"/>
    <rect x="107" y="107" width="58" height="34" rx="4" fill="rgba(240, 100, 73, 0.25)"/>
    <rect x="107" y="147" width="45" height="5" rx="2" fill="#FFFFFF" opacity="0.75"/>
    <rect x="107" y="156" width="30" height="5" rx="2" fill="#10B981"/>

    <!-- Direct WhatsApp Checkout Button -->
    <rect x="18" y="180" width="154" height="34" rx="17" fill="#25D366"/>
    <circle cx="36" cy="197" r="8" fill="#FFFFFF"/>
    <rect x="52" y="194" width="75" height="6" rx="2" fill="#FFFFFF"/>

    <!-- Ownership Tag -->
    <rect x="18" y="222" width="154" height="18" rx="9" fill="rgba(255, 255, 255, 0.06)"/>
    <text x="95" y="234" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">100% OWNED PLATFORM</text>
  </g>

  <!-- Central Advantage Badge -->
  <g transform="translate(235, 270)">
    <rect width="170" height="42" rx="21" fill="#111B33" stroke="#F06449" stroke-width="1.5" filter="url(#glow2)"/>
    <circle cx="24" cy="21" r="10" fill="#F06449"/>
    <path d="M 21 21 L 24 24 L 28 17" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="44" y="25" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="800">DIRECT ORDERS</text>
  </g>
</svg>