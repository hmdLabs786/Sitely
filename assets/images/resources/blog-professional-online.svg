<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1020"/>
      <stop offset="50%" stop-color="#121D38"/>
      <stop offset="100%" stop-color="#19294F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="coralGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7D66"/>
      <stop offset="100%" stop-color="#F06449"/>
    </linearGradient>
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 48, 86, 0.75)"/>
      <stop offset="100%" stop-color="rgba(16, 28, 54, 0.85)"/>
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad5)"/>

  <!-- Glowing Orbs -->
  <circle cx="170" cy="180" r="130" fill="#F59E0B" opacity="0.10" filter="url(#glow5)"/>
  <circle cx="470" cy="160" r="140" fill="#F06449" opacity="0.12" filter="url(#glow5)"/>

  <!-- Background Grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>

  <!-- Left: Verified Business Storefront Profile Card -->
  <g transform="translate(60, 50)">
    <rect width="240" height="260" rx="16" fill="url(#cardGrad5)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
    
    <!-- Verified Header Ribbon -->
    <path d="M0 16 Q0 0 16 0 L224 0 Q240 0 240 16 L240 50 L0 50 Z" fill="rgba(10, 18, 36, 0.85)"/>
    <circle cx="28" cy="25" r="13" fill="url(#goldGrad)"/>
    <!-- Crown / Star in header badge -->
    <path d="M 23 27 L 25 21 L 28 24 L 31 21 L 33 27 Z" fill="#0F172A"/>
    <rect x="50" y="18" width="95" height="8" rx="3" fill="#FFFFFF"/>
    <rect x="50" y="30" width="60" height="5" rx="2" fill="url(#goldGrad)"/>
    <circle cx="218" cy="25" r="7" fill="#10B981"/>
    <path d="M 215 25 L 217 27 L 221 23" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Business Brand Identity Preview -->
    <rect x="18" y="65" width="204" height="60" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)"/>
    <rect x="28" y="75" width="40" height="40" rx="8" fill="url(#coralGrad5)"/>
    <circle cx="48" cy="95" r="9" fill="#FFFFFF"/>
    <rect x="80" y="78" width="115" height="8" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <rect x="80" y="92" width="85" height="6" rx="2" fill="rgba(255, 255, 255, 0.5)"/>
    <rect x="80" y="104" width="55" height="5" rx="2" fill="#38BDF8"/>

    <!-- 5-Star Reputation Rating Row -->
    <rect x="18" y="138" width="204" height="42" rx="8" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.25)"/>
    <g transform="translate(30, 153)" fill="#F59E0B">
      <circle cx="6" cy="6" r="5"/>
      <circle cx="22" cy="6" r="5"/>
      <circle cx="38" cy="6" r="5"/>
      <circle cx="54" cy="6" r="5"/>
      <circle cx="70" cy="6" r="5"/>
    </g>
    <text x="125" y="163" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800">5.0 / 5.0 RATING</text>

    <!-- Custom Domain & Fast SSL Security -->
    <rect x="18" y="192" width="204" height="50" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)"/>
    <!-- Padlock icon -->
    <circle cx="38" cy="217" r="12" fill="rgba(16, 185, 129, 0.2)"/>
    <rect x="33" y="214" width="10" height="8" rx="2" fill="#10B981"/>
    <path d="M 35 214 L 35 210 Q 35 207 38 207 Q 41 207 41 210 L 41 214" fill="none" stroke="#10B981" stroke-width="1.8"/>
    <text x="60" y="215" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">https://yourbrand.pk</text>
    <text x="60" y="228" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="600">SSL ENCRYPTED &#8226; VERIFIED</text>
  </g>

  <!-- Right: Visual Trust Pillars -->
  <g transform="translate(340, 50)">
    <!-- First Impression Pillar Card -->
    <rect width="240" height="120" rx="16" fill="url(#cardGrad5)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="24" fill="url(#coralGrad5)" filter="url(#glow5)"/>
    <!-- Eye / Clean design icon -->
    <ellipse cx="50" cy="50" rx="12" ry="7" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="50" cy="50" r="4" fill="#FFFFFF"/>
    <rect x="90" y="35" width="125" height="10" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <rect x="90" y="52" width="95" height="7" rx="2" fill="url(#coralGrad5)"/>
    <rect x="25" y="88" width="190" height="18" rx="6" fill="rgba(255, 255, 255, 0.05)"/>
    <text x="120" y="100" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Clean Layouts Build Customer Trust</text>

    <!-- Professional Inquiries Card -->
    <g transform="translate(0, 140)">
      <rect width="240" height="120" rx="16" fill="url(#cardGrad5)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
      <circle cx="50" cy="50" r="24" fill="url(#goldGrad)" filter="url(#glow5)"/>
      <!-- Shield / Checkmark -->
      <path d="M 42 50 L 48 56 L 58 44" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="90" y="35" width="125" height="10" rx="3" fill="#FFFFFF" opacity="0.9"/>
      <rect x="90" y="52" width="85" height="7" rx="2" fill="url(#goldGrad)"/>
      <rect x="25" y="88" width="190" height="18" rx="6" fill="rgba(255, 255, 255, 0.05)"/>
      <text x="120" y="100" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">More Inquiries &amp; Repeat Clients</text>
    </g>
  </g>

  <!-- Top Floating Badge -->
  <g transform="translate(245, 18)">
    <rect width="150" height="36" rx="18" fill="#131D38" stroke="#F59E0B" stroke-width="1.5" filter="url(#glow5)"/>
    <circle cx="20" cy="18" r="8" fill="url(#goldGrad)"/>
    <path d="M 17 18 L 19 20 L 23 16" fill="none" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
    <text x="36" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">BRAND TRUST</text>
  </g>
</svg>