<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="fb-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="60%" stop-color="#F4EFE8"/>
      <stop offset="100%" stop-color="#E8DFD5"/>
    </radialGradient>
    <linearGradient id="fb-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#184E42"/>
      <stop offset="50%" stop-color="#0F382F"/>
      <stop offset="100%" stop-color="#09241E"/>
    </linearGradient>
    <linearGradient id="fb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8214"/>
    </linearGradient>
    <linearGradient id="fb-silk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#EDE6DD"/>
      <stop offset="100%" stop-color="#D8CEBF"/>
    </linearGradient>
    <filter id="fb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#09241E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#fb-bg)"/>

  <!-- Subtle Textile Weave Grid Background -->
  <g opacity="0.04" stroke="#09241E" stroke-width="1.2">
    <line x1="100" y1="0" x2="100" y2="500" stroke-dasharray="6 6"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke-dasharray="6 6"/>
    <line x1="300" y1="0" x2="300" y2="500" stroke-dasharray="6 6"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke-dasharray="6 6"/>
    <line x1="500" y1="0" x2="500" y2="500" stroke-dasharray="6 6"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke-dasharray="6 6"/>
    <line x1="700" y1="0" x2="700" y2="500" stroke-dasharray="6 6"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke-dasharray="6 6"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke-dasharray="6 6"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke-dasharray="6 6"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke-dasharray="6 6"/>
  </g>

  <!-- Central Glow -->
  <circle cx="400" cy="185" r="145" fill="#FFFFFF" opacity="0.8"/>

  <!-- Emblem / Logo Mark -->
  <g transform="translate(400, 185)" filter="url(#fb-shadow)">
    <!-- Circular Crest Container -->
    <circle cx="0" cy="0" r="86" fill="url(#fb-emerald)" stroke="url(#fb-gold)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-dasharray="5 5"/>

    <!-- Unstitched Fabric Roll & Draped Silk Waves -->
    <!-- Back Fabric Fold -->
    <path d="M -48 -22 C -24 -42 24 -42 48 -22 C 32 8 -32 8 -48 -22 Z" fill="#0C251F" opacity="0.6"/>
    
    <!-- Left Draped Ribbon of Fabric -->
    <path d="M -36 -28 C -15 -18 -10 18 -32 42 C -42 48 -48 38 -42 28 C -36 18 -26 4 -36 -28 Z" fill="url(#fb-gold)"/>

    <!-- Right Flowing Unstitched Fabric Drape -->
    <path d="M 0 -38 C 28 -38 46 -18 38 12 C 32 34 8 48 18 52 C 28 54 44 42 48 20 C 52 -6 32 -46 0 -38 Z" fill="url(#fb-silk)"/>

    <!-- Central Stylized Loom/Fabric Roll Icon -->
    <g transform="translate(0, 0)">
      <!-- Fabric Roll Oval Top -->
      <ellipse cx="0" cy="-12" rx="28" ry="10" fill="url(#fb-gold)"/>
      <ellipse cx="0" cy="-12" rx="20" ry="7" fill="#09241E"/>
      <!-- Fabric Roll Body -->
      <path d="M -28 -12 L -28 16 C -28 22 28 22 28 16 L 28 -12 Z" fill="url(#fb-gold)"/>
      <ellipse cx="0" cy="16" rx="28" ry="8" fill="#AA8214"/>
    </g>

    <!-- Golden Needle & Thread Motif -->
    <!-- Gold Needle -->
    <line x1="-32" y1="-38" x2="36" y2="34" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Needle Eye -->
    <ellipse cx="-28" cy="-34" rx="2" ry="4" fill="#09241E" transform="rotate(-45 -28 -34)"/>
    
    <!-- Sparkles -->
    <path d="M -48 -44 Q -48 -36 -40 -36 Q -48 -36 -48 -28 Q -48 -36 -56 -36 Q -48 -36 -48 -44 Z" fill="url(#fb-gold)"/>
    <path d="M 44 -40 Q 44 -34 50 -34 Q 44 -34 44 -28 Q 44 -34 38 -34 Q 44 -34 44 -40 Z" fill="url(#fb-gold)"/>
  </g>

  <!-- Brand Typography -->
  <text x="400" y="375" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', sans-serif" 
        font-size="38" 
        font-weight="800" 
        letter-spacing="7" 
        fill="#0C251F">FABRICAS</text>
  
  <!-- Subtitle Accent Line -->
  <line x1="310" y1="400" x2="490" y2="400" stroke="url(#fb-gold)" stroke-width="2.5" stroke-linecap="round"/>
  
  <text x="400" y="425" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Manrope', sans-serif" 
        font-size="12" 
        font-weight="700" 
        letter-spacing="3" 
        fill="#66594C">UNSTITCHED FABRICS &amp; TEXTILES</text>
</svg>
