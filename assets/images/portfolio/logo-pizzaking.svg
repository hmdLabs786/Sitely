<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="pk-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#221C1B"/>
      <stop offset="50%" stop-color="#181313"/>
      <stop offset="100%" stop-color="#0E0A0A"/>
    </radialGradient>
    <linearGradient id="pk-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="60%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="pk-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="pk-crust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="pk-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="pk-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#DC2626" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#pk-bg)"/>

  <!-- Charcoal Oven Ambient Fire Glow -->
  <circle cx="400" cy="180" r="150" fill="#DC2626" opacity="0.14" filter="url(#pk-glow)"/>
  <circle cx="400" cy="180" r="100" fill="#F59E0B" opacity="0.12" filter="url(#pk-glow)"/>

  <!-- Subtle Circular Brick/Stone Oven Ring -->
  <circle cx="400" cy="180" r="115" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Main Logo Mark -->
  <g transform="translate(400, 175)" filter="url(#pk-shadow)">
    
    <!-- Outer Shield Container -->
    <circle cx="0" cy="0" r="88" fill="#1A1515" stroke="url(#pk-gold)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#DC2626" stroke-width="1.5" opacity="0.5"/>

    <!-- Royal Crown on Top of Pizza Slice -->
    <path d="M -34 -32 L -42 -54 L -18 -44 L 0 -62 L 18 -44 L 42 -54 L 34 -32 Z" fill="url(#pk-gold)" stroke="#78350F" stroke-width="1"/>
    <!-- Crown Jewels -->
    <circle cx="-42" cy="-54" r="3.5" fill="#EF4444"/>
    <circle cx="0" cy="-62" r="4.5" fill="#EF4444"/>
    <circle cx="42" cy="-54" r="3.5" fill="#EF4444"/>
    <circle cx="-18" cy="-44" r="2.5" fill="#FFFFFF"/>
    <circle cx="18" cy="-44" r="2.5" fill="#FFFFFF"/>
    <rect x="-26" y="-35" width="52" height="6" rx="2" fill="#B45309"/>

    <!-- Pizza Slice Body -->
    <!-- Crust Arc at Top -->
    <path d="M -48 -22 Q 0 -34 48 -22 Q 52 -18 48 -14 Q 0 -24 -48 -14 Q -52 -18 -48 -22 Z" fill="url(#pk-crust)"/>
    
    <!-- Pizza Slice Triangle with Cheese Texture -->
    <path d="M -44 -14 Q 0 -22 44 -14 L 0 54 Z" fill="url(#pk-red)"/>
    
    <!-- Melting Golden Cheese Layer -->
    <path d="M -40 -12 Q 0 -18 40 -12 L 28 8 Q 18 20 8 16 Q 0 32 -10 22 Q -22 28 -28 10 Z" fill="url(#pk-gold)"/>

    <!-- Chicken Tikka & Pepperoni Chunks -->
    <circle cx="-12" cy="-2" r="6" fill="#991B1B" stroke="#7F1D1D" stroke-width="1"/>
    <circle cx="16" cy="2" r="7" fill="#991B1B" stroke="#7F1D1D" stroke-width="1"/>
    <circle cx="-2" cy="18" r="5" fill="#991B1B" stroke="#7F1D1D" stroke-width="1"/>
    <ellipse cx="6" cy="-8" rx="4" ry="2" fill="#15803D"/>
    <ellipse cx="-20" cy="6" rx="4" ry="2" fill="#15803D" transform="rotate(30 -20 6)"/>

    <!-- Cheese Drip -->
    <path d="M -2 50 C -4 56 0 60 0 60 C 0 60 4 56 2 50 Z" fill="url(#pk-gold)"/>
  </g>

  <!-- Brand Typography -->
  <text x="400" y="375" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', sans-serif" 
        font-size="38" 
        font-weight="900" 
        letter-spacing="6" 
        fill="#FFFFFF">PIZZA KING</text>
  
  <!-- Accent Line -->
  <line x1="310" y1="400" x2="490" y2="400" stroke="url(#pk-red)" stroke-width="3" stroke-linecap="round"/>
  
  <text x="400" y="426" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Manrope', sans-serif" 
        font-size="12" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#F59E0B">NAZIMABAD &#8226; CHARCOAL PIZZERIA</text>
</svg>
