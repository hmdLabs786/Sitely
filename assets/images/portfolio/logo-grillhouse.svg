<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#1F1F1F"/>
      <stop offset="100%" stop-color="#0F0F0F"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C83228"/>
      <stop offset="60%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <radialGradient id="glow-grill" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#E03E32" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E03E32" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="520" rx="16" fill="url(#bg-grill)"/>
  <circle cx="400" cy="205" r="210" fill="url(#glow-grill)"/>
  
  <!-- Charcoal Grill Circular Badge -->
  <circle cx="400" cy="205" r="100" fill="#242424" stroke="#383838" stroke-width="3"/>
  <circle cx="400" cy="205" r="92" fill="#1A1A1A" stroke="#C83228" stroke-width="2" stroke-dasharray="8,5"/>
  
  <!-- Grill Skewers & Fiery Flame Emblem -->
  <g transform="translate(400, 205)">
    <!-- Crossed Skewers -->
    <line x1="-65" y1="65" x2="65" y2="-65" stroke="#757575" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="65" y1="65" x2="-65" y2="-65" stroke="#757575" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Handle Grips -->
    <circle cx="-65" cy="65" r="5" fill="#C83228"/>
    <circle cx="65" cy="65" r="5" fill="#C83228"/>
    
    <!-- Central Charcoal Fire Flame -->
    <path d="M 0 -58 C 22 -30 35 -10 25 22 C 18 40 -18 40 -25 22 C -35 -10 -22 -30 0 -58 Z" fill="url(#flame-grad)"/>
    <path d="M 0 -35 C 12 -18 18 -5 12 14 C 8 24 -8 24 -12 14 C -18 -5 -12 -18 0 -35 Z" fill="#FFE082"/>
  </g>
  
  <!-- Brand Typography -->
  <text x="400" y="358" font-family="'Manrope', -apple-system, sans-serif" font-size="30" font-weight="900" fill="#FBF8F2" text-anchor="middle" letter-spacing="3">KARACHI GRILL HOUSE</text>
  <text x="400" y="392" font-family="'Manrope', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#E03E32" text-anchor="middle" letter-spacing="3">SMOKED BBQ, BURGERS &amp; ROLLS &#8226; FEDERAL B AREA</text>
  
  <!-- Accent Line -->
  <line x1="310" y1="416" x2="490" y2="416" stroke="#C83228" stroke-width="2.5" stroke-linecap="round"/>
</svg>