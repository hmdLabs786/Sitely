<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="fds-bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1A2238"/>
      <stop offset="55%" stop-color="#101524"/>
      <stop offset="100%" stop-color="#090C15"/>
    </radialGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="neon-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5858"/>
      <stop offset="100%" stop-color="#F09819"/>
    </linearGradient>
    <filter id="fds-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#fds-bg)"/>

  <!-- High-Tech Ambient Grid & Radial Glow -->
  <circle cx="400" cy="180" r="140" fill="#00F2FE" opacity="0.08" filter="url(#fds-glow)"/>

  <!-- Logo Mark: 3D Isometric Dynamic Data Stream Hexagon Engine -->
  <g transform="translate(400, 180)">
    <!-- Outer Connected Network Ring -->
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" 
             fill="none" 
             stroke="#2A3756" 
             stroke-width="2"/>
    
    <!-- Connection Nodes -->
    <circle cx="0" cy="-80" r="4" fill="url(#neon-cyan)"/>
    <circle cx="69" cy="-40" r="4" fill="url(#neon-cyan)"/>
    <circle cx="69" cy="40" r="4" fill="url(#neon-coral)"/>
    <circle cx="0" cy="80" r="4" fill="url(#neon-coral)"/>
    <circle cx="-69" cy="40" r="4" fill="url(#neon-coral)"/>
    <circle cx="-69" cy="-40" r="4" fill="url(#neon-cyan)"/>

    <!-- Inner 3D Faceted Hex Prism -->
    <!-- Top Face -->
    <polygon points="0,-18 52,-48 0,-68 -52,-48" fill="#2E3C62" stroke="#4FACFE" stroke-width="1.5"/>
    <!-- Left Face -->
    <polygon points="-52,-48 0,-18 0,44 -52,14" fill="#1B243D" stroke="#4FACFE" stroke-width="1.5"/>
    <!-- Right Face -->
    <polygon points="52,-48 0,-18 0,44 52,14" fill="#243050" stroke="#4FACFE" stroke-width="1.5"/>

    <!-- Dynamic Glowing Flow Engine (Isometric Core Arrow / Infinity Node) -->
    <path d="M -30 -6 L 0 12 L 30 -6" fill="none" stroke="url(#neon-cyan)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#fds-glow)"/>
    <path d="M 0 -28 L 0 24" fill="none" stroke="url(#neon-coral)" stroke-width="5" stroke-linecap="round" filter="url(#fds-glow)"/>
    <circle cx="0" cy="24" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography: ONLY Business Name -->
  <text x="400" y="375" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Inter', monospace, sans-serif" 
        font-size="35" 
        font-weight="800" 
        letter-spacing="6" 
        fill="#FFFFFF">FLOWDESK SOLUTIONS</text>
  
  <line x1="260" y1="400" x2="540" y2="400" stroke="url(#neon-cyan)" stroke-width="2.5" stroke-linecap="round"/>
</svg>