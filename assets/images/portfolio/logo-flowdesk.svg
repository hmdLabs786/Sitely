<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-flowdesk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1528"/>
      <stop offset="50%" stop-color="#141E38"/>
      <stop offset="100%" stop-color="#090D1A"/>
    </linearGradient>
    <linearGradient id="coral-flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7D66"/>
      <stop offset="100%" stop-color="#F06449"/>
    </linearGradient>
    <linearGradient id="cyan-flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="glow-flowdesk" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F06449" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F06449" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="520" rx="16" fill="url(#bg-flowdesk)"/>
  <circle cx="400" cy="205" r="220" fill="url(#glow-flowdesk)"/>
  
  <!-- Circuit Nodes & Connections -->
  <g opacity="0.3" stroke="#38BDF8" stroke-width="1.5">
    <line x1="240" y1="205" x2="310" y2="205"/>
    <line x1="490" y1="205" x2="560" y2="205"/>
    <circle cx="240" cy="205" r="4" fill="#38BDF8"/>
    <circle cx="560" cy="205" r="4" fill="#38BDF8"/>
  </g>
  
  <!-- Core Automation Hexagon -->
  <g transform="translate(400, 205)">
    <!-- Hexagon Outer -->
    <polygon points="0,-85 73.6,-42.5 73.6,42.5 0,85 -73.6,42.5 -73.6,-42.5" fill="#18233F" stroke="url(#coral-flow)" stroke-width="3"/>
    
    <!-- Flow Nodes / Loop -->
    <path d="M -35 -20 L 0 -45 L 35 -20 L 35 20 L 0 45 L -35 20 Z" fill="none" stroke="url(#cyan-flow)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="0" cy="-45" r="6" fill="url(#coral-flow)"/>
    <circle cx="35" cy="20" r="6" fill="url(#coral-flow)"/>
    <circle cx="-35" cy="20" r="6" fill="url(#coral-flow)"/>
    
    <!-- Central Fast forward / automation sync -->
    <polygon points="-12,-15 12,0 -12,15" fill="#F7F8FC"/>
  </g>
  
  <!-- Brand Typography -->
  <text x="400" y="358" font-family="'Manrope', -apple-system, sans-serif" font-size="30" font-weight="900" fill="#F7F8FC" text-anchor="middle" letter-spacing="4">FLOWDESK SOLUTIONS</text>
  <text x="400" y="392" font-family="'Manrope', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FF7D66" text-anchor="middle" letter-spacing="3">WORKFLOW AUTOMATION &amp; ENQUIRY ENGINE &#8226; KARACHI</text>
  
  <!-- Accent Line -->
  <line x1="310" y1="416" x2="490" y2="416" stroke="url(#coral-flow)" stroke-width="2.5" stroke-linecap="round"/>
</svg>