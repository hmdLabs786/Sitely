<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="fc-bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2D1228"/>
      <stop offset="60%" stop-color="#190A17"/>
      <stop offset="100%" stop-color="#0E050D"/>
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="25%" stop-color="#E5C07B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#AA8222"/>
      <stop offset="100%" stop-color="#EED59B"/>
    </linearGradient>
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E5C07B"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#fc-bg)"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="400" cy="200" r="180" fill="#E5C07B" opacity="0.06" filter="url(#gold-glow)"/>

  <!-- Logo Mark -->
  <g transform="translate(400, 185)">
    <!-- Outer Fine Diamond Frame -->
    <path d="M 0 -105 L 105 0 L 0 105 L -105 0 Z" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    
    <!-- Outer Concentric Circle -->
    <circle cx="0" cy="0" r="88" fill="none" stroke="url(#gold-grad)" stroke-width="2"/>
    <circle cx="0" cy="0" r="76" fill="none" stroke="url(#gold-grad)" stroke-width="1" opacity="0.5"/>
    
    <!-- Stylized Haute Couture Floral Crest / Crown -->
    <!-- Top Crown Leaf -->
    <path d="M 0 -76 C -12 -50 0 -25 0 0 C 0 -25 12 -50 0 -76 Z" fill="url(#gold-grad)" opacity="0.9"/>
    <!-- Bottom Petal -->
    <path d="M 0 76 C -12 50 0 25 0 0 C 0 25 12 50 0 76 Z" fill="url(#gold-grad)" opacity="0.9"/>
    <!-- Left Petal -->
    <path d="M -76 0 C -50 -12 -25 0 0 0 C -25 0 -50 12 -76 0 Z" fill="url(#gold-grad)" opacity="0.9"/>
    <!-- Right Petal -->
    <path d="M 76 0 C 50 -12 25 0 0 0 C 25 0 50 12 76 0 Z" fill="url(#gold-grad)" opacity="0.9"/>

    <!-- Diagonal Accent Petals -->
    <g transform="rotate(45)">
      <circle cx="0" cy="-60" r="3" fill="url(#gold-grad)"/>
      <circle cx="0" cy="60" r="3" fill="url(#gold-grad)"/>
      <circle cx="-60" cy="0" r="3" fill="url(#gold-grad)"/>
      <circle cx="60" cy="0" r="3" fill="url(#gold-grad)"/>
      <path d="M -40 0 C -20 -6 0 0 0 0 C 0 0 -20 6 -40 0 Z" fill="url(#gold-grad)" opacity="0.7"/>
      <path d="M 40 0 C 20 -6 0 0 0 0 C 0 0 20 6 40 0 Z" fill="url(#gold-grad)" opacity="0.7"/>
      <path d="M 0 -40 C -6 -20 0 0 0 0 C 0 0 6 -20 0 -40 Z" fill="url(#gold-grad)" opacity="0.7"/>
      <path d="M 0 40 C -6 20 0 0 0 0 C 0 0 6 20 0 40 Z" fill="url(#gold-grad)" opacity="0.7"/>
    </g>

    <!-- Center Interlocking Monogram Medallion -->
    <circle cx="0" cy="0" r="36" fill="#1A0B18" stroke="url(#gold-grad)" stroke-width="1.8"/>
    <!-- Center Stylized 'F' Monogram in Gold -->
    <path d="M -9 -18 L 12 -18 C 14 -18 15 -16 14 -14 C 13 -12 11 -12 9 -12 L -3 -12 L -3 -2 L 7 -2 C 9 -2 10 -0.5 9.5 1 C 9 2.5 7.5 2.5 5.5 2.5 L -3 2.5 L -3 18 L -9 18 Z" fill="url(#gold-light)"/>
  </g>

  <!-- Brand Typography: ONLY Business Name -->
  <text x="400" y="375" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Didot', 'Cinzel', serif" 
        font-size="34" 
        font-weight="600" 
        letter-spacing="9" 
        fill="url(#gold-light)">FATIMA COLLECTION</text>
  
  <line x1="280" y1="400" x2="520" y2="400" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.6"/>
</svg>