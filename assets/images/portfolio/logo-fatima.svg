<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-fatima" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1525"/>
      <stop offset="50%" stop-color="#4A203B"/>
      <stop offset="100%" stop-color="#1F0D19"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA6"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7C0C9"/>
      <stop offset="100%" stop-color="#D97D8E"/>
    </linearGradient>
    <radialGradient id="glow-fatima" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D97D8E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D97D8E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="520" rx="16" fill="url(#bg-fatima)"/>
  <circle cx="400" cy="210" r="230" fill="url(#glow-fatima)"/>
  
  <!-- Decorative Arch Outline -->
  <path d="M 280 320 L 280 200 C 280 133 520 133 520 200 L 520 320 Z" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6,4"/>
  <circle cx="400" cy="205" r="96" fill="#3B182E" stroke="url(#gold-grad)" stroke-width="2.5"/>
  <circle cx="400" cy="205" r="88" fill="none" stroke="#D97D8E" stroke-width="1" stroke-opacity="0.5"/>
  
  <!-- Floral/Couture Motif & Monogram FC -->
  <g transform="translate(400, 205)">
    <!-- Petals -->
    <path d="M 0 -80 C 15 -55 15 -35 0 -20 C -15 -35 -15 -55 0 -80 Z" fill="url(#rose-grad)" opacity="0.65"/>
    <path d="M 0 80 C 15 55 15 35 0 20 C -15 35 -15 55 0 80 Z" fill="url(#rose-grad)" opacity="0.65"/>
    <path d="M -80 0 C -55 15 -35 15 -20 0 C -35 -15 -55 -15 -80 0 Z" fill="url(#rose-grad)" opacity="0.65"/>
    <path d="M 80 0 C 55 15 35 15 20 0 C 35 -15 55 -15 80 0 Z" fill="url(#rose-grad)" opacity="0.65"/>
    
    <!-- Central Monogram -->
    <text x="0" y="16" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="52" font-weight="700" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="2">FC</text>
  </g>
  
  <!-- Brand Typography -->
  <text x="400" y="365" font-family="'Manrope', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FAF6F0" text-anchor="middle" letter-spacing="4">FATIMA COLLECTION</text>
  <text x="400" y="398" font-family="'Manrope', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#D97D8E" text-anchor="middle" letter-spacing="3">EASTERN HAUTE COUTURE &#8226; GULSHAN-E-IQBAL</text>
  
  <!-- Accent Line -->
  <line x1="330" y1="422" x2="470" y2="422" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round"/>
</svg>