<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-noor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF6F6"/>
      <stop offset="50%" stop-color="#D7EFEF"/>
      <stop offset="100%" stop-color="#C5E6E6"/>
    </linearGradient>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36B3A4"/>
      <stop offset="100%" stop-color="#1F7A6F"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F9DE6"/>
      <stop offset="100%" stop-color="#2864A8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" rx="16" fill="url(#bg-noor)"/>
  
  <!-- Soft Healthcare Rings -->
  <circle cx="400" cy="205" r="140" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="400" cy="205" r="105" fill="#FFFFFF" stroke="url(#teal-grad)" stroke-width="3" filter="drop-shadow(0 8px 18px rgba(31,122,111,0.12))"/>
  
  <!-- Healthcare Cross + Gentle Caring Leaf Motif -->
  <g transform="translate(400, 205)">
    <!-- Modern Soft Rounded Cross -->
    <rect x="-14" y="-52" width="28" height="104" rx="8" fill="url(#teal-grad)"/>
    <rect x="-52" y="-14" width="104" height="28" rx="8" fill="url(#teal-grad)"/>
    <!-- Healing Leaf inside -->
    <path d="M 0 -22 C 22 -22 35 -5 32 18 C 12 18 0 5 0 -22 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M 0 22 C -22 22 -35 5 -32 -18 C -12 -18 0 -5 0 22 Z" fill="#E8F8F5" opacity="0.8"/>
  </g>
  
  <!-- Brand Typography -->
  <text x="400" y="358" font-family="'Manrope', -apple-system, sans-serif" font-size="30" font-weight="800" fill="#144B44" text-anchor="middle" letter-spacing="3">NOOR FAMILY CLINIC</text>
  <text x="400" y="392" font-family="'Manrope', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1F7A6F" text-anchor="middle" letter-spacing="3">NEIGHBOURHOOD HEALTHCARE &#8226; GULISTAN-E-JOHAR</text>
  
  <!-- Accent Line -->
  <line x1="320" y1="416" x2="480" y2="416" stroke="url(#teal-grad)" stroke-width="2.5" stroke-linecap="round"/>
</svg>