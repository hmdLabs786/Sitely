<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="nfc-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="60%" stop-color="#E6F7F0"/>
      <stop offset="100%" stop-color="#D5EFE6"/>
    </radialGradient>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="nfc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F766E" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#nfc-bg)"/>

  <!-- Pristine Healthcare Medallion -->
  <circle cx="400" cy="180" r="105" fill="#FFFFFF" filter="url(#nfc-shadow)"/>
  <circle cx="400" cy="180" r="96" fill="none" stroke="#CCFBF1" stroke-width="3"/>

  <!-- Logo Mark: Modern Medical Care Cross intertwined with Protective Leaf -->
  <g transform="translate(400, 180)">
    <!-- Outer Shield Halo -->
    <path d="M 0 -70 C 45 -70 65 -45 65 0 C 65 48 0 72 0 72 C 0 72 -65 48 -65 0 C -65 -45 -45 -70 0 -70 Z" 
          fill="none" 
          stroke="url(#cyan-accent)" 
          stroke-width="2" 
          stroke-dasharray="6 4" 
          opacity="0.7"/>

    <!-- Medical Plus Cross in Precision Rounded Geometry -->
    <!-- Vertical Bar -->
    <rect x="-14" y="-48" width="28" height="96" rx="14" fill="url(#teal-grad)"/>
    <!-- Horizontal Bar -->
    <rect x="-48" y="-14" width="96" height="28" rx="14" fill="url(#teal-grad)"/>

    <!-- Center Overlap Care Leaf Motif -->
    <path d="M 0 -24 C 20 -24 24 0 0 24 C -24 0 -20 -24 0 -24 Z" fill="url(#cyan-accent)"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography: ONLY Business Name -->
  <text x="400" y="375" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" 
        font-size="35" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#0F766E">NOOR FAMILY CLINIC</text>
  
  <line x1="280" y1="400" x2="520" y2="400" stroke="url(#cyan-accent)" stroke-width="2.5" stroke-linecap="round"/>
</svg>