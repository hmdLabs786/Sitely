<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-thread" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="50%" stop-color="#EFEFEF"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
    <linearGradient id="olive-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C8A4B"/>
      <stop offset="100%" stop-color="#556030"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" rx="16" fill="url(#bg-thread)"/>
  
  <!-- Subtle Weave Pattern Lines -->
  <g opacity="0.15" stroke="#252B3A" stroke-width="1">
    <line x1="250" y1="120" x2="550" y2="120"/>
    <line x1="250" y1="290" x2="550" y2="290"/>
    <line x1="280" y1="90" x2="280" y2="320"/>
    <line x1="520" y1="90" x2="520" y2="320"/>
  </g>
  
  <!-- Contemporary Geometric Loop Monogram (T & T) -->
  <circle cx="400" cy="205" r="98" fill="#FFFFFF" stroke="#252B3A" stroke-width="2.5" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.06))"/>
  <circle cx="400" cy="205" r="88" fill="none" stroke="url(#olive-grad)" stroke-width="1.5" stroke-dasharray="6,4"/>
  
  <g transform="translate(400, 205)">
    <!-- Stylized Weave / Thread Loop -->
    <path d="M -45 -25 C -45 -55 0 -55 0 -15 C 0 25 45 25 45 55" fill="none" stroke="url(#olive-grad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 45 -25 C 45 -55 0 -55 0 -15 C 0 25 -45 25 -45 55" fill="none" stroke="#252B3A" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="-15" r="7" fill="#DDA15E"/>
  </g>
  
  <!-- Brand Typography -->
  <text x="400" y="358" font-family="'Manrope', -apple-system, sans-serif" font-size="30" font-weight="900" fill="#252B3A" text-anchor="middle" letter-spacing="4">THREAD &amp; TONE</text>
  <text x="400" y="392" font-family="'Manrope', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#606C38" text-anchor="middle" letter-spacing="3">CASUAL &amp; EVERYDAY RETAIL &#8226; TARIQ ROAD</text>
  
  <!-- Accent Line -->
  <line x1="330" y1="416" x2="470" y2="416" stroke="#252B3A" stroke-width="2" stroke-linecap="round"/>
</svg>