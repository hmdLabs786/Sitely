<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="tt-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="60%" stop-color="#EFF1F5"/>
      <stop offset="100%" stop-color="#E2E6EC"/>
    </radialGradient>
    <linearGradient id="tt-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="tt-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="tt-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#tt-bg)"/>

  <!-- Modern Fashion Clean Circle Background -->
  <circle cx="400" cy="180" r="105" fill="#FFFFFF" filter="url(#tt-shadow)"/>
  <circle cx="400" cy="180" r="98" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Logo Mark: Architectural Weave & Soundwave Monogram (T & T intertwined) -->
  <g transform="translate(400, 180)">
    <!-- Interlocking Kinetic Thread Loop 1 (Thread) -->
    <path d="M -48 18 C -48 -24 -12 -54 22 -38 C 42 -28 48 -6 32 16 C 18 36 -12 36 -28 14" 
          fill="none" 
          stroke="#0F172A" 
          stroke-width="10" 
          stroke-linecap="round"/>
    
    <!-- Interlocking Kinetic Thread Loop 2 (Tone) with Vibrant Gradient -->
    <path d="M 48 -18 C 48 24 12 54 -22 38 C -42 28 -48 6 -32 -16 C -18 -36 12 -36 28 -14" 
          fill="none" 
          stroke="url(#tt-indigo)" 
          stroke-width="10" 
          stroke-linecap="round"/>

    <!-- Central Precision Needle / Wave Point Accent -->
    <circle cx="0" cy="0" r="7" fill="url(#tt-accent)"/>
  </g>

  <!-- Brand Typography: ONLY Business Name -->
  <text x="400" y="375" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Inter', 'Helvetica Neue', sans-serif" 
        font-size="36" 
        font-weight="800" 
        letter-spacing="6" 
        fill="#0F172A">THREAD &amp; TONE</text>
  
  <line x1="300" y1="400" x2="500" y2="400" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
</svg>